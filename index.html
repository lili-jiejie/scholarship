<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>题目练习</title>
  <style>
    :root {
      color-scheme: light;
      font-family: 仿宋, FangSong, STFangsong, "FangSong", serif;
      color: #23332d;
      background: #f3f5ef;
      font-synthesis: none;
    }
    * { box-sizing: border-box; }
    body {
      min-height: 100vh;
      margin: 0;
      padding: 48px 20px;
      font-family: inherit;
      background: radial-gradient(ellipse at 50% 0%, #e3eee5 0, #f3f5ef 56%);
    }
    button, select { font: inherit; }
    .page { width: min(760px, 100%); margin: 0 auto; }
    header { margin: 0 0 25px; text-align: center; }
    .eyebrow { color: #668271; font-size: 15px; letter-spacing: .18em; }
    h1 { margin: 10px 0 0; font-size: clamp(28px, 5vw, 38px); font-weight: 500; }
    .card {
      overflow: hidden;
      border: 1px solid #e1e8df;
      border-radius: 20px;
      background: rgba(255,255,255,.94);
      box-shadow: 0 18px 55px rgba(37, 65, 48, .09);
    }
    .toolbar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
      padding: 19px 24px;
      border-bottom: 1px solid #edf0ea;
      color: #6d7f72;
      font-size: 16px;
    }
    .toolbar label { display: flex; align-items: center; gap: 9px; }
    select {
      max-width: min(250px, 58vw);
      padding: 8px 30px 8px 11px;
      border: 1px solid #dce5dc;
      border-radius: 9px;
      color: #344a3c;
      background: #fff;
      cursor: pointer;
    }
    .content { padding: clamp(24px, 6vw, 44px); }
    .question { margin: 0; font-size: clamp(21px, 4vw, 27px); line-height: 1.8; font-weight: 500; white-space: pre-wrap; }
    .options { display: grid; gap: 12px; margin: 25px 0 0; padding: 0; list-style: none; }
    .option {
      display: flex;
      gap: 12px;
      align-items: flex-start;
      padding: 13px 15px;
      border: 1px solid #e8ede7;
      border-radius: 11px;
      color: #46564b;
      font-size: 18px;
      line-height: 1.6;
      background: #fafbf9;
    }
    .option-letter { flex: 0 0 25px; color: #6b8c75; }
    .answer {
      display: none;
      margin-top: 25px;
      padding: 17px 19px;
      border: 1px solid #d5e7d8;
      border-radius: 12px;
      color: #315a3c;
      font-size: 19px;
      line-height: 1.7;
      background: #f0f8f0;
      white-space: pre-wrap;
    }
    .answer.visible { display: block; }
    .answer-title { display: block; margin-bottom: 3px; color: #67856d; font-size: 15px; }
    .actions { display: flex; justify-content: flex-end; gap: 12px; margin-top: 32px; }
    .actions button {
      min-width: 108px;
      padding: 11px 20px;
      border: 1px solid #d6e2d7;
      border-radius: 10px;
      color: #47634d;
      background: #fff;
      cursor: pointer;
      transition: background .15s, transform .15s;
    }
    .actions button:hover:not(:disabled) { transform: translateY(-1px); background: #f2f7f1; }
    .actions .next { border-color: #527b5d; color: #fff; background: #527b5d; }
    .actions .next:hover:not(:disabled) { background: #426b4d; }
    .actions button:disabled { opacity: .42; cursor: not-allowed; }
    footer { padding: 17px 20px; border-top: 1px solid #edf0ea; color: #87948a; text-align: center; font-size: 14px; }
    @media (max-width: 480px) {
      body { padding: 28px 14px; }
      .toolbar { padding: 16px; }
      .actions button { flex: 1; }
    }
  </style>
</head>
<body>
  <main class="page">
    <header>
      <div class="eyebrow">QUESTION PRACTICE</div>
      <h1>题目练习</h1>
    </header>
    <section class="card" aria-label="题目练习卡片">
      <div class="toolbar">
        <span id="progress"></span>
        <label for="questionSelect">跳转到
          <select id="questionSelect" aria-label="选择题目"></select>
        </label>
      </div>
      <div class="content">
        <p class="question" id="question"></p>
        <ol class="options" id="options"></ol>
        <div class="answer" id="answer" aria-live="polite"></div>
        <div class="actions">
          <button type="button" id="answerButton">答案</button>
          <button type="button" class="next" id="nextButton">下一题</button>
        </div>
      </div>
      <footer id="footer"></footer>
    </section>
  </main>
  <script>
    const questions = [{"section": "选择题", "number": 1, "text": "抗日战争中，国民革命军大量装备的中正式步枪仿制自（）。", "choices": ["M1891莫辛-纳甘步枪", "1898式毛瑟步枪", "1924式毛瑟步枪", "M1903春田步枪"], "answer": "3"}, {"section": "选择题", "number": 2, "text": "抗日战争中，国民革命军大量装备的ZB26捷克式轻机枪使用（）。", "choices": [".30-06春田步枪弹", "7.92×57mm毛瑟步枪弹", "6.5mm友坂步枪弹", "0.303步枪弹"], "answer": "2"}, {"section": "选择题", "number": 3, "text": "抗日战争中，中国国民革命军兵力最高时达（）。", "choices": ["400万人", "500万人", "600万人", "700万人"], "answer": "2"}, {"section": "选择题", "number": 4, "text": "八路军在抗日战场上牺牲的最高指挥员是（）。", "choices": ["方志敏", "叶挺", "项英", "左权"], "answer": "4"}, {"section": "选择题", "number": 5, "text": "在黄土岭战斗中，八路军战士使用（）击毙日军中将阿部规秀。", "choices": ["步枪", "掷弹筒", "迫击炮", "轻机枪"], "answer": "3"}, {"section": "选择题", "number": 6, "text": "考虑日军装备情况，在以下四种武器中，八路军最难缴获的武器是（）。", "choices": ["三八式步枪", "百式冲锋枪", "大正十一式轻机枪", "八九式掷弹筒"], "answer": "2"}, {"section": "选择题", "number": 7, "text": "一般认为，北洋海军在大东沟海战中排出的阵型源于（）中（）方的阵型。", "choices": ["纳瓦里诺海战  英国", "纳瓦里诺海战  土耳其", "利萨海战  意大利", "利萨海战  奥地利"], "answer": "4"}, {"section": "选择题", "number": 8, "text": "抗战时期的中国海军的下列四艘军舰中，（）并非是清朝海军的遗留。", "choices": ["海容", "逸仙", "大同", "中山"], "answer": "2"}, {"section": "选择题", "number": 9, "text": "抗战时期的中国海军的宁海号巡洋舰是（）制造的。", "choices": ["日本", "中国", "英国", "德国"], "answer": "1"}, {"section": "选择题", "number": 10, "text": "日军全面侵华开始时，中国海军舰艇总排水量为（）。", "choices": ["3.2万吨", "6.8万吨", "8.4万吨", "10.3万吨"], "answer": "2"}, {"section": "选择题", "number": 11, "text": "中日虎门海战中，中方的总指挥官是（）。", "choices": ["陈绍宽", "陈策", "方念祖", "陈季良"], "answer": "2"}, {"section": "选择题", "number": 12, "text": "中国工农红军的第一架飞机被命名为（）。该机的来源是（）。", "choices": ["马克思号  缴获", "列宁号  缴获", "马克思号  购买", "列宁号  购买"], "answer": "2"}, {"section": "选择题", "number": 13, "text": "1938年5月19日，中华民国空军派出（）轰炸机以“纸弹”空袭日本。", "choices": ["TB-3", "SB-2", "马丁139WC", "He-111"], "answer": "3"}, {"section": "选择题", "number": 14, "text": "1937年8月14日的8.14空战中，首个击落日机的飞行员是（）。", "choices": ["高志航", "乐以琴", "刘粹刚", "阎海文"], "answer": "1"}, {"section": "选择题", "number": 15, "text": "以下 ""], "answer": "正确"}, {"section": "判断题", "number": 48, "text": "地面部队数字化将改变传统力量的结构模式，引起作战方式的根本性变革。", "choices": ["正确", "", "", ""], "answer": "正确"}, {"section": "判断题", "number": 49, "text": "机械化战争是数量决定效能。", "choices": ["正确", "", "", ""], "answer": "正确"}, {"section": "判断题", "number": 50, "text": "科索沃战争是一场典型的信息时代的信息化战争与工业时代的机械化战争之间的非对称性较量。", "choices": ["正确", "", "", ""], "answer": "正确"}, {"section": "判断题", "number": 51, "text": "阿富汗战争告诉我们，建立在卫星监控技术之上的远程导弹精确打击和准确拦截技术，已成为未来战争成败的关键。", "choices": ["正确", "", "", ""], "answer": "正确"}, {"section": "判断题", "number": 52, "text": "信息化战争是时代的产物，是世界政治、经济、科技、军事、文化等多种因素综合作用的结果，但它当前仍处于初始阶段。", "choices": ["正确", "", "", ""], "answer": "正确"}, {"section": "判断题", "number": 53, "text": "美军对过去的战略和三军的作战理论进行了全面的审查，于1992年正式提出了以对付局部战争威胁为主要目标的“地区防务战”战略。", "choices": ["正确", "", "", ""], "answer": "正确"}, {"section": "判断题", "number": 54, "text": "在世界战争史上，海湾战争是第一次被人们称作“信息战争”的战例。", "choices": ["正确", "", "", ""], "answer": "正确"}, {"section": "判断题", "number": 55, "text": "战争走过了冷兵器时代、火器时代、机械化战争时代，现在正逐步向信息化战争时代过渡。", "choices": ["正确", "", "", ""], "answer": "正确"}, {"section": "判断题", "number": 56, "text": "“海湾战争”是冷战结束以后参战国最多的一场局部战争。", "choices": ["正确", "", "", ""], "answer": "正确"}, {"section": "判断题", "number": 57, "text": "游击战、运动战、阵地战被称为“老三战”的作战形式。", "choices": ["正确", "", "", ""], "answer": "正确"}, {"section": "判断题", "number": 58, "text": "TMD是战区导弹防御系统的缩写。", "choices": ["正确", "", "", ""], "answer": "正确"}, {"section": "判断题", "number": 59, "text": "美军在伊拉克战争中首次使用了携带温压弹头的新型地狱火导弹。", "choices": ["正确", "", "", ""], "answer": "正确"}, {"section": "判断题", "number": 60, "text": "随着高技术的发展，武器系统已被“多矛多盾”相互制约系统的对抗所代替。", "choices": ["正确", "", "", ""], "answer": "正确"}, {"section": "判断题", "number": 61, "text": "人们把C4ISR系统称为“力量倍增器”。  ", "choices": ["正确", "", "", ""], "answer": "正确"}, {"section": "判断题", "number": 62, "text": "伊拉克战争无论是作战理论的变革、武器装备的使用，还是作战方法的创新，都展现出与以往战争迥然不同的许多新特点。", "choices": ["正确", "", "", ""], "answer": "正确"}, {"section": "判断题", "number": 63, "text": "固体式火箭发动机相对 xt": "寻的制导的工作方式有主动式和被动式两种。", "choices": ["错误", "", "", ""], "answer": "错误"}, {"section": "判断题", "number": 80, "text": "美国“铜斑蛇”激光制导炮弹采用的是激光被动寻的制导系统。", "choices": ["错误", "", "", ""], "answer": "错误"}, {"section": "判断题", "number": 81, "text": "反摧毁是指在查明敌方电子装备及其工作情况的基础上，用直接毁伤的方法使其瘫痪的一种电子对抗手段。", "choices": ["错误", "", "", ""], "answer": "错误"}, {"section": "判断题", "number": 82, "text": "阿富汗战争充分体现了全体系震慑性打击的作战思想。", "choices": ["错误", "", "", ""], "answer": "错误"}, {"section": "判断题", "number": 83, "text": "军事伪装按运用范围分类可分为战略伪装、战役伪装和战术伪装三类，分别由战役军团司令部、战术兵团司令部、战斗司令部组织实施。", "choices": ["错误", "", "", ""], "answer": "错误"}, {"section": "判断题", "number": 84, "text": "雷达隐身技术主要通过抑制目标的电磁信号特征来达到隐身目的的技术。", "choices": ["错误", "", "", ""], "answer": "错误"}, {"section": "判断题", "number": 85, "text": "精确制导武器是指直接命中概率超过60%的制导武器。", "choices": ["错误", "", "", ""], "answer": "错误"}, {"section": "判断题", "number": 86, "text": "激光武器不能用光速飞行。", "choices": ["错误", "", "", ""], "answer": "错误"}, {"section": "判断题", "number": 87, "text": "导弹预警卫星上装有红外传感器和可见光相机，能在导弹发射后80秒内捕捉到导弹尾焰并确定其位置。", "choices": ["错误", "", "", ""], "answer": "错误"}, {"section": "判断题", "number": 88, "text": "高技术有军用和民用之分，但作为高技术的主要组成部分，大量的军事高技术不可以作为民用。", "choices": ["错误", "", "", ""], "answer": "错误"}, {"section": "判断题", "number": 89, "text": "常用的自动地面传感器有音响传感器、地震传感器、磁传感器、红外传感器、压力传感器等五种基本类型。", "choices": ["错误", "", "", ""], "answer": "错误"}, {"section": "判断题", "number": 90, "text": "遥控制导不受制导站跟踪探测系统作用距离的限制，精度随射程增加而提高。", "choices": ["错误", "", "", ""], "answer": "错误"}, {"section": "判断题", "number": 91, "text": "在军队建设的指导思想上，必须实现从数量规模型向质量效能型、从科技密集型向人力密集型的两个根本性转变。", "choices": ["错误", "", "", ""], "answer": "错误"}, {"section": "判断题", "number": 92, "text": "战争形式上突出信息化、智能化、全方位化的诸军兵种联合作战，使传统的运动战、阵地战、游击战等作战形式面临挑战。", "choices": ["错误", "", "", ""], "answer": "错误"}, {"section": "判断题", "number": 93, "text": "军事科学院和国防大学不直接隶属于中央军委。", "choices": ["错误", "", "", ""], "answer": "错误"}, {"section": "判断题", "number": 94, "text": "可见光的伪装与色度有关，由于可见光侦察发现目标的主要因素就是识别目标与背景的色度差异，差别越小越容易发现。", " oices": ["错误", "", "", ""], "answer": "错误"}, {"section": "判断题", "number": 111, "text": "机械化战争的作战指挥控制是纵向连接的树状结构。", "choices": ["错误", "", "", ""], "answer": "错误"}, {"section": "判断题", "number": 112, "text": "空中部队的数字化和作战行动方式的线式一体化是信息化战争全面形成的标志。 ", "choices": ["错误", "", "", ""], "answer": "错误"}, {"section": "判断题", "number": 113, "text": "平战转换机制是把军用科技潜力迅速转化为战场上现实战斗力的运行方式。", "choices": ["错误", "", "", ""], "answer": "错误"}, {"section": "判断题", "number": 114, "text": "在今年的第二届“装甲与反装甲日”上，VT5被称为主战坦克而非轻型坦克", "choices": ["正确", "", "", ""], "answer": "正确"}, {"section": "判断题", "number": 115, "text": "中国海军已经拥有29艘现役驱逐舰，而且老式的051型驱逐舰已经退役完毕。   ", "choices": ["错误", "", "", ""], "answer": "错误"}, {"section": "判断题", "number": 116, "text": "俄罗斯海军现在仍保持四大舰队编制。                                     ", "choices": ["正确", "", "", ""], "answer": "正确"}, {"section": "判断题", "number": 117, "text": "中国海军052D型驱逐舰搭载的是国产QC-280型燃气轮机                 ", "choices": ["正确", "", "", ""], "answer": "正确"}, {"section": "判断题", "number": 118, "text": "我国每年应征报名时间为2月1日至8月15日", "choices": ["错误", "", "", ""], "answer": "错误"}, {"section": "判断题", "number": 119, "text": "905型综合补给舰是从903型基础上发展来的我国目前装备最多的综合补给舰", "choices": ["错误", "", "", ""], "answer": "错误"}, {"section": "判断题", "number": 120, "text": "泰国海军“北大年”级护卫舰由中国于本世纪初承建，采用的是中国标准的武器系统接口。                                                                  ", "choices": ["错误", "", "", ""], "answer": "错误"}, {"section": "判断题", "number": 121, "text": "隐形战斗机是通过在机身涂上一层高效吸收电波的物质，造成雷达在一定距离上无法连续追踪的效果。所以隐形飞机并不能通过雷达探测发现", "choices": ["错误", "", "", ""], "answer": "错误"}, {"section": "判断题", "number": 122, "text": "末敏弹药不能自动跟踪目标，也不能改变飞行弹道，只能在被散布的范围内利用其自身的探测器(寻的器)探测和攻击目标。", "choices": ["正确", "", "", ""], "answer": "正确"}, {"section": "判断题", "number": 123, "text": "任何武装直升机都没有配备弹射座椅", "choices": ["错误", "", "", ""], "answer": "错误"}, {"section": "判断题", "number": 124, "text": "中国63式107毫米火箭炮曾用于支援越南抗美救国战争，期间越南部队使用该火箭炮攻击一处美军机场，击毁了包括B-52在内的数十架作战飞机", "choices": ["正确", "", "", ""], "answer": "正确"}, {"section": "判断题", "number": 125, "text": "重型对地攻击机“空中炮艇”是由C-17运输机改装而成", "choices": ["错误", "", "", ""], "answer": "错误"}, {"section": "判断题", "number": 126, "text": "中国第一款预警机“空警一号”由图-4轰炸机改装而来，加装了845型雷达，但在探测低空目标时，受地面杂波影响，效果非常不理想因而被迫放弃研制工作", "choices": ["错误", "", "", ""], "answer": "错误"}, {"section": "判断题", "number": 127, "text": "美国从第六代攻击型核潜艇“海狼”级开始放弃了核动力装置最大的噪声源－－主循环泵，采用了具有自然循环冷却能力的S6G反应堆。", "choices": ["错误", "", "", ""], "answer": "错误"}, {"section": "判断题", "number": 128, "text": "法国“红宝石”级（SNA72型）攻击型核潜艇是世界上尺寸最小的现代化核潜艇", "choices": ["正确", "", "", ""], "answer": "正确"}, {"section": "判断题", "number": 129, "text": "美国的AGM-88“哈姆”导弹是一种第三代反坦克导弹。", "choices": ["错误", "", "", ""], "answer": "错误"}, {"section": "判断题", "number": 130, "text": "美国海军的EA-6B飞机，是一种战略运输飞机。", "choices": ["错误", "", "", ""], "answer": "错误"}, {"section": "判断题", "number": 131, "text": "战争消耗相对较少是信息化战争的特征之一。", "choices": ["错误", "", "", ""], "answer": "错误"}, {"section": "判断题", "number": 132, "text": "激光雷达的特点是分辨率高、图像清晰、盲区小、不受天气条件影响。", "choices": ["错误", "", "", ""], "answer": "错误"}, {"section": "判断题", "number": 133, "text": "我国自行研制的大型运载火箭系列的名称是\"东风系列运载火箭\"。", "choices": ["错误", "", "", ""], "answer": "错误"}, {"section": "判断题", "number": 134, "text": "科索沃战争被称为是世界战争史上的第一次\"信息战争\"。", "choices": ["错误", "", "", ""], "answer": "错误"}, {"section": "判断题", "number": 135, "text": "卫星绕地球运转所具备的基本条件是:速度条件和轨道条件。", "choices": ["错误", "", "", ""], "answer": "错误"}, {"section": "判断题", "number": 136, "text": "次声武器的一个基本特点就是声音小。", "choices": ["错误", "", "", ""], "answer": "错误"}, {"section": "判断题", "number": 137, "text": "世界上第一颗人造地球卫星是美国于1957年10月4日发射成功的。", "choices": ["错误", "", "", ""], "answer": "错误"}, {"section": "判断题", "number": 138, "text": "决定未来信息化战争的是精确制导武器的数量和性能优劣。", "choices": ["错误", "", "", ""], "answer": "错误"}];
    const choiceNames = ['选项一', '选项二', '选项三', '选项四'];
    const choiceLetters = ['A', 'B', 'C', 'D'];
    let currentIndex = 0;

    const select = document.getElementById('questionSelect');
    const progress = document.getElementById('progress');
    const questionEl = document.getElementById('question');
    const optionsEl = document.getElementById('options');
    const answerEl = document.getElementById('answer');
    const answerButton = document.getElementById('answerButton');
    const nextButton = document.getElementById('nextButton');
    const footer = document.getElementById('footer');

    questions.forEach((item, index) => {
      const option = document.createElement('option');
      option.value = String(index);
      option.textContent = `${item.section} ${item.number}`;
      select.append(option);
    });

    function render() {
      const item = questions[currentIndex];
      progress.textContent = `${currentIndex + 1} / ${questions.length}`;
      questionEl.textContent = item.text;
      optionsEl.replaceChildren();
      const choices = item.section === '判断题' ? [] : item.choices;
      choices.forEach((choice, index) => {
        if (!choice) return;
        const li = document.createElement('li');
        li.className = 'option';
        const letter = document.createElement('span');
        letter.className = 'option-letter';
        letter.textContent = `${choiceLetters[index]}.`;
        const text = document.createElement('span');
        text.textContent = choice;
        li.append(letter, text);
        optionsEl.append(li);
      });
      answerEl.classList.remove('visible');
      answerEl.replaceChildren();
      select.value = String(currentIndex);
      nextButton.disabled = currentIndex === questions.length - 1;
      footer.textContent = `${item.section} · 第 ${item.number} 题`;
    }

    answerButton.addEventListener('click', () => {
      const item = questions[currentIndex];
      const title = document.createElement('span');
      title.className = 'answer-title';
      title.textContent = '正确答案';
      answerEl.replaceChildren(title);
      if (item.section === '判断题') {
        answerEl.append(document.createTextNode(item.answer));
      } else {
        const answerIndexes = [...item.answer].map(value => Number(value) - 1);
        const answers = answerIndexes
          .filter(index => Number.isInteger(index) && index >= 0 && index < item.choices.length && item.choices[index])
          .map(index => `${choiceNames[index]}：${item.choices[index]}`);
        answerEl.append(document.createTextNode(answers.join('；')));
      }
      answerEl.classList.add('visible');
    });

    nextButton.addEventListener('click', () => {
      if (currentIndex < questions.length - 1) {
        currentIndex += 1;
        render();
      }
    });
    select.addEventListener('change', () => {
      currentIndex = Number(select.value);
      render();
    });

    document.addEventListener('keydown', event => {
      if (event.repeat || event.altKey || event.ctrlKey || event.metaKey) return;
      if (event.target instanceof HTMLElement &&
          (event.target.isContentEditable || event.target.matches('input, textarea, select, button'))) return;

      if (event.code === 'Space') {
        event.preventDefault();
        if (answerEl.classList.contains('visible')) {
          nextButton.click();
        } else {
          answerButton.click();
        }
      } else if (event.key === 'ArrowUp') {
        event.preventDefault();
        if (currentIndex > 0) {
          currentIndex -= 1;
          render();
        }
      } else if (event.key === 'ArrowDown') {
        event.preventDefault();
        nextButton.click();
      }
    });

    render();
  </script>
</body>
</html>
